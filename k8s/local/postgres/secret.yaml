# ============================================================================
# SECRET: credenziali Postgres
# ----------------------------------------------------------------------------
# Un Secret invece di un ConfigMap perché contiene la password: Kubernetes
# li tratta diversamente (es. non finiscono nei log di 'kubectl describe',
# possono essere montati con permessi più restrittivi, alcuni cluster li
# cifrano at-rest se configurato).
#
# IMPORTANTE: qui i valori sono in chiaro solo per leggibilità del file
# sorgente. 'stringData' viene codificato automaticamente in base64 da
# Kubernetes quando applichi il manifest — NON è comunque una cifratura
# reale (base64 è solo un encoding, chiunque abbia accesso al Secret può
# decodificarlo). Per un uso professionale valuta:
#   - Sealed Secrets / SOPS per poter committare i secret in git in sicurezza
#   - Un secret manager esterno (Vault, AWS Secrets Manager, ecc.) con
#     External Secrets Operator
# Per ora, in locale/dev, questo approccio va benissimo.
#
# NON committare questo file con password reali in un repo pubblico o
# condiviso: se lo versioni, sostituisci i valori con placeholder e tieni
# il file reale fuori da git (es. in .gitignore) oppure creane una copia
# solo locale.
# ============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: fleet-pulse
type: Opaque
stringData:
  POSTGRES_DB: robofleet_db
  POSTGRES_USER: admin
  POSTGRES_PASSWORD: admin
